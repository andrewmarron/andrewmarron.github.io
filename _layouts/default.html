<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Canonical & Social / SEO Meta Tags -->
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ page.title | default: site.title }}">
    <meta property="og:description" content="{{ page.description | default: site.description }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:site_name" content="Andy Marron">
    <meta name="twitter:card" content="summary_large_image">

    <!-- Author & Book Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Andy Marron",
      "alternateName": "Andrew Marron",
      "url": "https://andrewmarron.github.io/",
      "description": "Sci-fi, urban fantasy, and comedy author and musician based in Teesside, United Kingdom, writing stories about people and creatures in absurd situations.",
      "jobTitle": ["Author", "Writer", "Musician"],
      "genre": ["Science Fiction", "Urban Fantasy", "Comedy"],
      "homeLocation": {
        "@type": "Place",
        "name": "Teesside, United Kingdom"
      },
      "sameAs": [
        "https://www.tiktok.com/@andy.marron",
        "https://www.instagram.com/andy_marron_author"
      ],
      "authorOf": {
        "@type": "Book",
        "name": "How To Not Make It In Music",
        "author": {
          "@type": "Person",
          "name": "Andy Marron"
        }
      }
    }
    </script>

    <!-- Slate theme CSS -->
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
  </head>
  <body>

    <!-- REPLACED HEADER -->
<header>
  <div style="
    position: relative;
    width: 100%;
    border-bottom: 6px solid #fff;
    overflow: hidden;
  ">
    <img src="/assets/img/website_header.png" alt="Andy Marron header banner" style="
      display: block;
      width: 100%;
    ">

    <div style="
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 0 16px;
      background: rgba(0, 0, 0, 0.25);
    ">
      <h1 style="
        font-size: clamp(2rem, 5vw, 4rem);
        margin: 0;
        letter-spacing: 2px;
        font-weight: 700;
        color: #fdfdfd;
        text-shadow:
          0 0 12px rgba(255,255,255,0.45),
          0 3px 6px rgba(0,0,0,0.7);
      ">
        ANDY MARRON
      </h1>

      <p style="
        font-size: clamp(1rem, 2vw, 1.6rem);
        font-style: italic;
        margin: 0.35rem 0 0 0;
        color: #f5f5f5;
        text-shadow:
          0 0 8px rgba(255,255,255,0.35),
          0 2px 4px rgba(0,0,0,0.6);
      ">
        Author · Storyteller
      </p>
    </div>
  </div>
</header>

<nav id="sitenav" style="
  width: 100%;
  background: #111;
  border-bottom: 6px solid white;
  padding: 12px 0;
  text-align: center;
  margin-bottom: 30px;
">
  <a href="/" style="
    color: white;
    text-decoration: none;
    margin: 0 20px;
    font-size: 1.1em;
    letter-spacing: 1px;
  ">HOME</a>
  
   <a href="/aboutme" style="
    color: white;
    text-decoration: none;
    margin: 0 20px;
    font-size: 1.1em;
    letter-spacing: 1px;
  ">ABOUT ME</a>
      <!-- 
  <a href="/contact" style="
    color: white;
    text-decoration: none;
    margin: 0 20px;
    font-size: 1.1em;
    letter-spacing: 1px;
  ">CONTACT</a>
  -->
</nav>


    <section class="page-header">
      <!-- empty: we’re not using Slate’s default title block anymore -->
    </section>

    <section class="main-content">
      {{ content | markdownify }}
    </section>

{% if page.comments %}
<h2 style="color:#fff; text-align:center; margin-top:60px;">
  Leave a Comment
</h2>

  <!-- Disqus embed -->
  <div id="disqus_thread"></div>
  <script>
  var disqus_config = function () {
    this.page.url = window.location.href;
    this.page.identifier = window.location.pathname;
  };
  (function() {
    var d = document, s = d.createElement('script');
    s.src = 'https://andrewmarron.disqus.com/embed.js';
    s.setAttribute('data-timestamp', +new Date());
    (d.head || d.body).appendChild(s);
  })();
  </script>
  <noscript>Please enable JavaScript to view the comments.</noscript>
{% endif %}

<button id="back-to-top">Back to navigation ↑</button>
<script>
document.getElementById("back-to-top").addEventListener("click", function() {
  const nav = document.getElementById("sitenav");
  const navPosition = nav.offsetTop;
  window.scrollTo({ top: navPosition, behavior: 'smooth' });
});
</script>

  </body>
</html>
